name: Build nightly binaries and perform releases

on:
  # For pushes to main, build binaries and store them as artifacts (also upload Docker images)
  # For pushes to main with tags, also make a GitHub release.
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  DOCKER_IMAGE: splitgraph/seafowl

jobs:
  build_binary:
    name: Build the binaries
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        build: [linux-x86_64, linux-aarch64, osx-x86_64]
        include:
          - build: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            protoc_arch: linux-x86_64
            docker_platform: linux/amd64
          - build: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            protoc_arch: linux-aarch_64
            docker_platform: linux/arm64
          - build: osx-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            protoc_arch: osx-x86_64

    steps:
      - name: Install prerequisites
        # Taken from https://github.com/apache/arrow-datafusion/blob/master/.github/workflows/rust.yml
        shell: bash
        run: |
          mkdir -p $HOME/d/protoc
          cd $HOME/d/protoc
          export PROTO_ZIP="protoc-21.4-${{ matrix.protoc_arch }}.zip"
          curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v21.4/$PROTO_ZIP
          unzip $PROTO_ZIP
          echo "$HOME/d/protoc/bin" >> $GITHUB_PATH
          export PATH=$PATH:$HOME/d/protoc/bin
          protoc --version

      - name: Checkout the repository
        uses: actions/checkout@v4
      - run: |
          rustup toolchain install nightly-2024-12-30 --profile minimal
          rustup default nightly-2024-12-30

      - uses: Swatinem/rust-cache@v2
        with:
          # shared-key: ""
          # key: ""
          # env-vars: ""
          # workspaces: ""

          # Determines if the cache should be saved even when the workflow has failed.
          cache-on-failure: "true"

      - name: Build the release binary
        shell: bash
        run: |
          export PATH=$PATH:$HOME/d/protoc/bin
          cargo build --release

      - name: Test invoking the binaries
        shell: bash
        run: |
          ./target/release/seafowl --version || exit 1

      - name: Prepare artifact name
        shell: bash
        run: |
          echo "ARTIFACT=seafowl-nightly-${{ matrix.target }}" >> $GITHUB_ENV
          echo "SOURCE=target/release/seafowl" >> $GITHUB_ENV

      - name: Login to DockerHub (Linux only)
        if: startsWith(matrix.build, 'linux-')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx (Linux only)
        if: startsWith(matrix.build, 'linux-')
        uses: docker/setup-buildx-action@v3

      - name: Test building and invoking the Docker image (Linux only)
        if: startsWith(matrix.build, 'linux-')
        run: |
          DOCKER_BUILDKIT=1 docker build . -t ${{ env.DOCKER_IMAGE }}:test
          docker run --rm ${{ env.DOCKER_IMAGE }}:test --version

      - name: Determine Docker labels (Linux only)
        if: startsWith(matrix.build, 'linux-')
        id: meta
        # https://github.com/docker/metadata-action
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}

      # Each architecture pushes an untagged image by digest; the docker_manifest job
      # then combines the per-architecture digests into a single multi-arch tag.
      - name: Build and push Docker image by digest (Linux only)
        if: startsWith(matrix.build, 'linux-')
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.docker_platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs:
            type=image,name=${{ env.DOCKER_IMAGE
            }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the Docker image digest (Linux only)
        if: startsWith(matrix.build, 'linux-')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.docker_build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the Docker image digest as an artifact (Linux only)
        if: startsWith(matrix.build, 'linux-')
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.build }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.SOURCE }}

  docker_manifest:
    name: Push the multi-arch Docker manifest
    needs: build_binary
    runs-on: ubuntu-latest
    steps:
      - name: Get the per-architecture digests
        uses: actions/download-artifact@v4
        with:
          pattern: docker-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker tags
        id: meta
        # https://github.com/docker/metadata-action
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_IMAGE }}
          # Latest push to main: add nightly/latest tags
          # Tag pushes: add full version (e.g. 0.1.1) and major.minor (e.g. 0.1)
          tags: |
            type=raw,value=nightly,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{startsWith(github.event.ref, 'refs/tags/v')}}
            type=semver,pattern={{major}}.{{minor}},enable=${{startsWith(github.event.ref, 'refs/tags/v')}}
            type=raw,value=commit-{{sha}}

      - name: Create the manifest list and push it
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.DOCKER_IMAGE }}@sha256:%s ' *)

      - name: Inspect the pushed image
        run: |
          docker buildx imagetools inspect ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.version }}

  github_release:
    name: Perform GitHub release
    needs: build_binary
    runs-on: ubuntu-latest
    if: startsWith(github.event.ref, 'refs/tags/v')
    steps:
      - name: Get the release version from the tag
        shell: bash
        if: env.RELEASE_VERSION == ''
        run: |
          # See: https://github.community/t5/GitHub-Actions/How-to-get-just-the-tag-name/m-p/32167/highlight/true#M1027
          echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "version is: ${{ env.RELEASE_VERSION }}"

      # Checkout required to access the release-notes.py script
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Generate release notes
        run: |
          ./.github/workflows/release-notes.py --tag ${{ env.RELEASE_VERSION }} --output notes-${{ env.RELEASE_VERSION }}.md
          cat notes-${{ env.RELEASE_VERSION }}.md

      - name: Get artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: seafowl-nightly-*
          path: artifacts

      - name: Package artifacts
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin; do
            chmod +x "artifacts/seafowl-nightly-$target/seafowl"
            tar -C "artifacts/seafowl-nightly-$target" \
              -czf "seafowl-${{ env.RELEASE_VERSION }}-$target.tar.gz" seafowl
          done

      - name: Upload release archive
        uses: softprops/action-gh-release@v2
        with:
          files: |
            seafowl-${{ env.RELEASE_VERSION }}-x86_64-unknown-linux-gnu.tar.gz
            seafowl-${{ env.RELEASE_VERSION }}-aarch64-unknown-linux-gnu.tar.gz
            seafowl-${{ env.RELEASE_VERSION }}-x86_64-apple-darwin.tar.gz
          body_path: notes-${{ env.RELEASE_VERSION }}.md
